          ceiling, then the assignee resolved by traversal of this tenant's Membership edges
          only. A user id from another tenant is unreachable by that traversal.
      x-deny-reasons: [SOURCE_BLOCKED, RATE_LIMITED, NO_SESSION, SESSION_EXPIRED, TOKEN_REVOKED, CSRF_INVALID, SUSPENDED, READONLY_MODE, TENANT_MISMATCH, NOT_A_MEMBER, INSUFFICIENT_ROLE, NOT_FOUND, VALIDATION_FAILED]
