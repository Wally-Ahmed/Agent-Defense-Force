  # --------------------------------------------------------------- comments --

  "/tenants/{tenant_id}/projects/{project_id}/tasks/{task_id}/comments":
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listComments
      tags: [comments]
