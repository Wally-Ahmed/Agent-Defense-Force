server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Range requests (audio seeking) are on by default in nginx; stated explicitly
    # so the walkthrough's <audio> scrubbing keeps working.
    max_ranges 1;

    # mp3 -> audio/mpeg comes from the stock mime.types; asserted here so a
    # future base-image change cannot silently break audio playback.
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        text/plain                            txt md;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/svg+xml                         svg;
        image/gif                             gif;
        image/webp                            webp;
        video/mp4                             mp4;
        video/webm                            webm;
        audio/mpeg                            mp3;
        audio/wav                             wav;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;

    # Media is immutable per deploy; HTML stays fresh so redeploys show up.
    location ~* \.(mp3|mp4|png|jpg|jpeg|svg|gif|webp|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location ~* \.(html|txt|md)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # No SPA fallback: this is a single static page, and a catch-all rewrite to
    # index.html would answer 200 for paths that do not exist (masking audits).
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
