# Agent-Defense-Force — narrated walkthrough (static site).
# Serves walkthrough/ via nginx. No backend, no secrets, no app code.
app = "agent-defense-force"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  # Never cold-start into a spinner during the live demo.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
